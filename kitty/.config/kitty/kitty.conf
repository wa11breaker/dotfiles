macos_option_as_alt    yes
# Font
font_size              13.5
# font_family            JetBrains mono
font_family            Terminess Nerd Font Mono
disable_ligatures      always
# font_family            IosevkaNerdFont
bold_font              auto
italic_font            auto
bold_italic_font       auto

cursor_trail           1
cursor_trail_decay     0.1 0.4

# adjust_line_height     12
adjust_column_width    0
modify_font cell_height 130%

# Window
remember_window_size   no
initial_window_width   1000
initial_window_height  650
window_border_width    1pt
window_margin_width    0
window_padding_width   2 4
inactive_text_alpha    1.0
window_margin_width    0
single_window_margin_width  0
window_border_width    1pt
hide_window_decorations no

background_opacity         1
dynamic_background_opacity yes

# Bell
visual_bell_duration   0.0
enable_audio_bell      no


background #2c2e34
foreground #e2e2e3

selection_background #3d4455
selection_foreground #e1e3e4

cursor #e1e3e4
cursor_text_color background

active_tab_background #72cce8
active_tab_foreground #181a1c
active_tab_font_style bold
inactive_tab_background #363944
inactive_tab_foreground #a0a6b2
inactive_tab_font_style normal

# Black
color0 #181a1c
color8 #828a9a

# Red
color1 #ff6578
color9 #ff6578

# Green
color2 #9dd274
color10 #9dd274

# Yellow
color3 #eacb64
color11 #eacb64

# Blue
color4 #72cce8
color12 #72cce8

# Magenta
color5 #ba9cf3
color13 #ba9cf3

# Cyan
color6 #f69c5e
color7 #f69c5e

# White
color7 #e1e3e4
color15 #e1e3e4

# --- Tab bar ---
tab_bar_edge top
tab_bar_style          powerline
tab_powerline_style    slanted
tab_bar_margin_height  2 2
tab_title_template     " {index}: {title[:30]} "
active_tab_title_template " {index}: {title[:30]} "

# --- Splits ---
enabled_layouts splits,stack
# cmd+| : split side-by-side (vertical divider)
map cmd+shift+backslash launch --location=vsplit --cwd=current
map cmd+|               launch --location=vsplit --cwd=current
# cmd+- : split top/bottom (horizontal divider)
map cmd+minus           launch --location=hsplit --cwd=current

# --- Borders ---
draw_minimal_borders   yes
active_border_color    #72cce8
inactive_border_color  #3d4455
bell_border_color      #ff6578

# --- Tabs ---
map cmd+w close_window
